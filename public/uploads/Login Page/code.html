<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-xl flex flex-col gap-lg relative">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">

<p class="font-body-md text-body-md text-on-surface-variant">Hoş geldiniz, lütfen hesabınıza giriş yapın.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md w-full">
<!-- Email Field -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-colors" id="email" name="email" placeholder="e-posta@ornek.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs w-full">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-colors" id="password" name="password" placeholder="********" required="" type="password"/>
</div>
</div>
<!-- Form Options -->
<div class="flex justify-between items-center w-full mt-xs">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="form-checkbox h-4 w-4 text-primary border-outline-variant rounded focus:ring-primary bg-surface transition-colors" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Beni Hatırla</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Şifremi Unuttum</a>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm px-lg rounded flex items-center justify-center gap-sm mt-sm hover:bg-primary-container transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                    Giriş Yap
                    <span class="material-symbols-outlined text-lg">login</span>
</button>
</form>
