version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apv-hemisan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hemisan
      POSTGRES_PASSWORD: papvba
      POSTGRES_DB: apv_hemisan_doctool
    ports:
      # Yalnızca localhost'a bağla: uygulama aynı sunucuda localhost:5435 ile
      # bağlanır; DB'yi LAN'a açmaya gerek yok (aksi halde iş verisi ifşa olur).
      - "127.0.0.1:5435:5432"
    volumes:
      - apv_hemisan_data:/var/lib/postgresql/data

volumes:
  apv_hemisan_data:
